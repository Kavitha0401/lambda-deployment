version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - pip install aws-sam-cli
  build:
    commands:
      - sam build --template-file sam/template.yaml
  post_build:
    commands:
      # Automatically provisions your API Gateway & Lambda function without requiring S3 bucket management
      - sam deploy --stack-name automated-sam-web-stack --resolve-s3 --capabilities CAPABILITY_IAM --no-confirm-changeset
