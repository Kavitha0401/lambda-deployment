version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - pip install aws-sam-cli
  build:
    commands:
      - sam build --template-file sam/template.yaml
  post_build:
    commands:
      - sam deploy --stack-name web-committed-sam-stack --resolve-s3 --capabilities CAPABILITY_IAM --no-confirm-changeset
